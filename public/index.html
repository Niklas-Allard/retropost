<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetroPost</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%2314122b'/%3E%3Crect x='1' y='1' width='6' height='4' fill='%23ff5fa2'/%3E%3Crect x='2' y='2' width='1' height='2' fill='%23ffd23f'/%3E%3Crect x='1' y='6' width='6' height='1' fill='%2338e1ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="crt"></div>
<div class="shell">
  <aside class="side" id="side">
    <a class="logo" href="#/studio" aria-label="RetroPost">
      <span class="logo-mark"></span>
      <span class="logo-txt">RETRO<b>POST</b></span>
    </a>
    <label class="proj-pick">
      <span class="lbl">PROJEKT</span>
      <select id="projectSelect"></select>
    </label>
    <nav id="nav"></nav>
    <div class="side-sessions">
      <div class="lbl">CHATS <span id="sesCount"></span></div>
      <div id="sideSessions"></div>
    </div>
    <div class="side-status" id="sideStatus"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="btn icon-only menu-btn" id="menuBtn" aria-label="Menü">≡</button>
      <h1 id="pageTitle">…</h1>
      <div class="top-actions" id="topActions"></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toasts"></div>
<script src="/icons.js"></script>
<script src="/app.js"></script>
</body>
</html>
