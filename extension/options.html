<!doctype html><html lang="de"><meta charset="utf-8"><title>RetroPost</title>
<body style="background:#14122b;color:#f4f1de;font:15px monospace;padding:18px;min-width:340px">
<h3 style="color:#ff5fa2;margin-top:0">RETROPOST · TikTok Studio</h3>
<label>Extension-Token (RetroPost › System)<br><input id="token" style="width:100%;margin:6px 0 12px;padding:6px;background:#221e45;color:#f4f1de;border:2px solid #4a4290"></label>
<button id="load" style="padding:6px 10px">Konten laden</button>
<label><br>TikTok-Konto in diesem Chrome-Profil<br><select id="acc" style="width:100%;margin:6px 0 12px;padding:6px;background:#221e45;color:#f4f1de;border:2px solid #4a4290"></select></label>
<button id="save" style="padding:8px 12px;background:#ff5fa2;border:0;font-weight:bold">Speichern</button>
<button id="now" style="padding:8px 12px">Jetzt prüfen</button>
<p id="msg" style="color:#a39cd0"></p>
<script src="options.js"></script></body></html>
